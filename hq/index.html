<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="/favicon.ico">
<title>Sebby Services HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --ink:#0C2330;--ink-muted:#4A6570;--ink-faint:#6B8490;
  --surface:#FFFFFF;--mist:#EEF4F3;--deep:#0C2330;--line:#D6E2E3;
  --harbor:#0F5C63;--harbor-hover:#0B4A50;--on-harbor:#FFFFFF;--harbor-tint:#E4F1EF;--lagoon:#57C4B5;
  --marigold:#F5B544;--on-marigold:#0C2330;--marigold-tint:#FFF4DC;--marigold-ink:#8A5A00;
  --deep-text:#EAF2F1;--deep-muted:#A9BEC3;--deep-raised:#10293A;--deep-line:#22404F;
  --success:#1E7A52;--success-tint:#E3F3EA;--danger:#B4402C;--danger-tint:#FBE9E5;--focus:#0F5C63;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r-sm:8px;--r-md:14px;--r-lg:22px;--r-tail:6px;
  --shadow-card:0 1px 2px rgba(12,35,48,.06),0 8px 24px rgba(12,35,48,.08);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#EAF2F1;--ink-muted:#A9BEC3;--ink-faint:#7D949E;
  --surface:#0A1C26;--mist:#10293A;--deep:#06141C;--line:#22404F;
  --harbor:#57C4B5;--harbor-hover:#7FD6CA;--on-harbor:#0C2330;--harbor-tint:#123A44;--lagoon:#7FD6CA;
  --marigold-tint:#3A2E14;--marigold-ink:#F5C46A;
  --success:#5CC794;--success-tint:#12301F;--danger:#F08A74;--danger-tint:#3A1A14;--focus:#7FD6CA;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#EAF2F1;--ink-muted:#A9BEC3;--ink-faint:#7D949E;
  --surface:#0A1C26;--mist:#10293A;--deep:#06141C;--line:#22404F;
  --harbor:#57C4B5;--harbor-hover:#7FD6CA;--on-harbor:#0C2330;--harbor-tint:#123A44;--lagoon:#7FD6CA;
  --marigold-tint:#3A2E14;--marigold-ink:#F5C46A;
  --success:#5CC794;--success-tint:#12301F;--danger:#F08A74;--danger-tint:#3A1A14;--focus:#7FD6CA;
  color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--surface);color:var(--ink);font:16px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--deep)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--harbor)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.small{font-size:.94rem}
.stamp{font-family:var(--mono);font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}

/* top bar: deep band, the one dark surface */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--deep);color:var(--deep-text)}
.bar{max-width:1280px;margin:0 auto;padding:12px 18px 0;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;white-space:nowrap}
.brand em{font-style:normal;color:var(--deep-muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{color:var(--deep-muted);font-size:.85rem;white-space:nowrap}
.tabs{max-width:1280px;margin:0 auto;padding:4px 10px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--deep-muted);padding:10px 12px 12px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--deep-text)}
.tab[aria-selected="true"]{color:var(--deep-text);border-bottom-color:var(--lagoon)}
.count{min-width:22px;height:22px;padding:0 7px;border-radius:999px;display:inline-grid;place-items:center;font-size:.78rem;background:var(--marigold);color:var(--on-marigold);font-weight:700}

main{max-width:1280px;margin:0 auto;padding:22px max(18px,env(safe-area-inset-right,0px)) 90px max(18px,env(safe-area-inset-left,0px))}
.view{display:flex;flex-direction:column;gap:22px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--harbor);background:var(--harbor);color:var(--on-harbor);border-radius:999px;padding:9px 16px;font-weight:700;font-size:.95rem;cursor:pointer;line-height:1.2;min-height:40px}
.btn:hover{background:var(--harbor-hover);border-color:var(--harbor-hover)}
.btn.ghost{background:transparent;color:var(--harbor)}
.btn.ghost:hover{background:var(--harbor-tint)}
.btn.warm{background:var(--marigold);border-color:var(--marigold);color:var(--on-marigold)}
.btn.warm:hover{filter:brightness(.95)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink-muted)}
.btn.quiet:hover{border-color:var(--harbor);color:var(--harbor)}
.btn.sm{padding:6px 12px;font-size:.88rem;min-height:34px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;background:var(--harbor-tint);color:var(--harbor)}
.chip.warm{background:var(--marigold-tint);color:var(--marigold-ink)}
.chip.bad{background:var(--danger-tint);color:var(--danger)}
.chip.ok{background:var(--success-tint);color:var(--success)}

textarea,input[type=text],input[type=number],select{width:100%;background:var(--surface);border:1.5px solid var(--ink-faint);border-radius:var(--r-sm);padding:10px 12px;font-size:1rem}
textarea{resize:vertical;line-height:1.5}
label.lbl{display:block;font-weight:700;font-size:.94rem;margin-bottom:6px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.88rem;color:var(--ink-muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--harbor-tint);color:var(--harbor)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* Echo Desk */
.desk-head{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.desk-head h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:800;letter-spacing:-.025em;line-height:1.05}
.meters{display:flex;gap:22px;flex-wrap:wrap}
.meter b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:800;line-height:1}
.meter span{font-size:.9rem;color:var(--ink-muted)}
.meter.due b{color:var(--marigold-ink)}
.desk{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;align-items:start}
.composer{background:var(--mist);border-radius:var(--r-lg) var(--r-lg) var(--r-lg) var(--r-tail);padding:22px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(var(--hdr,100px) + 12px)}
.linked{background:var(--surface);border:1.5px dashed var(--harbor);border-radius:var(--r-md);padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.94rem}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;border:0;border-radius:999px;width:22px;height:22px;background:var(--deep);color:#fff;cursor:pointer;line-height:1}
.status{min-height:1.4em;font-size:.94rem;color:var(--ink-muted)}
.status.bad{color:var(--danger)}
.flag{background:var(--marigold-tint);color:var(--marigold-ink);border-radius:var(--r-md);padding:10px 12px;font-weight:700}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:28px;color:var(--ink-muted);grid-column:1/-1}
/* each chat is a message bubble: tail side shows whose move it is */
.card{border-radius:var(--r-lg);padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;border:1.5px solid transparent;transition:border-color .2s,box-shadow .2s}
.card.mine{background:var(--mist);border-bottom-left-radius:var(--r-tail)}
.card.waiting{background:var(--harbor-tint);border-bottom-right-radius:var(--r-tail)}
.card.due{border-color:var(--marigold);box-shadow:0 0 0 4px var(--marigold-tint)}
.card.late{border-color:var(--danger)}
.card .top-row{display:flex;gap:8px;align-items:center}
.card .label{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
.card .label-input{flex:1;font-weight:700;padding:4px 8px}
.clock{font-family:var(--display);font-weight:800;font-size:2.3rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card.due .clock{color:var(--marigold-ink)}
.card.late .clock{color:var(--danger)}
.next{font-size:.92rem;color:var(--ink-muted)}
.track{height:6px;border-radius:999px;background:color-mix(in srgb,var(--ink-faint) 25%,transparent);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--harbor);border-radius:999px}
.card.due .track i{background:var(--marigold)}
.card.late .track i{background:var(--danger)}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.iconbtn{border:0;background:none;color:var(--ink-faint);cursor:pointer;padding:4px;border-radius:8px;display:inline-grid;place-items:center}
.iconbtn:hover{color:var(--ink);background:color-mix(in srgb,var(--ink-faint) 15%,transparent)}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--marigold)}100%{box-shadow:0 0 0 14px transparent}}
.card.ping{animation:ping .9s ease-out 2}
@media (prefers-reduced-motion:reduce){.card.ping{animation:none}}

.quick{display:flex;flex-direction:column;gap:12px;border-top:1.5px solid var(--line);padding-top:18px}
.quick .row .btn{flex:0 0 auto}

/* panels */
.panel{border:1.5px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.hero-num{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,7vw,4rem);line-height:1;letter-spacing:-.03em}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.mix{display:flex;height:16px;border-radius:999px;overflow:hidden;gap:2px}
.mix span{display:block;height:100%}
.legend{display:grid;gap:6px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:4px;flex:none}
.scroll-x{overflow-x:auto}
.bars text{font-family:var(--body);font-size:11px;fill:var(--ink-muted)}
.rule{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .dot{width:10px;height:10px;border-radius:999px;margin-top:8px;flex:none}
.rule p+p{margin-top:2px}
.deep-band{background:var(--deep);color:var(--deep-text);border-radius:var(--r-lg);padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.deep-band .muted{color:var(--deep-muted)}
.deep-band a{color:var(--lagoon)}
.prog{height:10px;border-radius:999px;background:var(--mist);overflow:hidden}
.prog i{display:block;height:100%;background:var(--harbor)}

dialog{border:0;border-radius:var(--r-lg);padding:0;max-width:min(720px,94vw);width:100%;background:var(--surface);color:var(--ink);box-shadow:0 18px 40px rgba(12,35,48,.3)}
dialog::backdrop{background:rgba(6,20,28,.55)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:var(--deep-text);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media (max-width:900px){
  .desk{grid-template-columns:1fr}
  .composer{position:static}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media (max-width:560px){
  .brand em,.sync{display:none}
  .clock{font-size:2rem}
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">
      <svg width="30" height="32" viewBox="0 0 30 32" aria-hidden="true"><path d="M15 1 27 5.5v9.8c0 7.6-5 12.6-12 15.7-1.3-.6-2.5-1.2-3.6-1.9L5 31.5l1.4-6.2C4.2 22.8 3 19.4 3 15.3V5.5Z" fill="#57C4B5"/><circle cx="10" cy="15" r="1.9" fill="#0C2330"/><circle cx="15" cy="15" r="1.9" fill="#0C2330"/><circle cx="20" cy="15" r="1.9" fill="#0C2330"/></svg>
      <b>Sebby Services HQ</b>
      <em id="today"></em>
    </div>
    <span class="sync" id="sync">Saved on this device</span>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>
<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(n,d=0)=>"$"+Number(n||0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const todayKey=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

/* ---------- baseline: totals only from the Oct 2026 export (no customer data) ---------- */
const SNAP={"label":"No export imported yet","rows":0,"total":0,"byType":{},"byDay":{},"byWeek":{},"questions":0,"inProgress":0};

/* ---------- default templates (plain text, no ratings asks, no PII asks) ---------- */
const TPL_DEFAULT={
 en:{
  open:"Hi, I'm Sebastian and I'll help you get this sorted out.\n\nTo give you the right fix, can you tell me:\n- What device (and model) are you using?\n- What exactly happens when you try, including any error message?",
  ci1:"Hi again, just checking in. Were you able to try those steps?\n\nIf anything didn't work the way I described, tell me what you're seeing and I'll walk you through it.",
  ci2:"Following up one more time. Is everything working now, or would you like me to keep troubleshooting with you?\n\nI'm right here if you need me.",
  close:"Since I haven't heard back, I'll assume you're all set for now.\n\nIf anything else comes up with this, just reply here and I'll pick it right back up. Glad I could help, and have a great day.",
  call:"This one will be faster to fix live. I can call you or do a secure screen share through JustAnswer and walk you through it step by step.\n\nWould that work for you?",
  optout:"This question is outside my area, so I'm going to open it up to another expert who can help you best. You'll be connected shortly."
 },
 es:{
  open:"Hola, soy Sebastian y le voy a ayudar a resolver esto.\n\nPara darle la solución correcta, ¿me puede decir:\n- Qué dispositivo (y modelo) está usando?\n- Qué pasa exactamente cuando lo intenta, incluyendo cualquier mensaje de error?",
  ci1:"Hola de nuevo, solo quería saber cómo le fue. ¿Pudo probar esos pasos?\n\nSi algo no funcionó como le expliqué, dígame qué está viendo y le guío paso a paso.",
  ci2:"Le escribo una vez más. ¿Ya está funcionando todo, o prefiere que sigamos resolviéndolo juntos?\n\nAquí estoy si me necesita.",
  close:"Como no he recibido respuesta, asumo que ya está todo bien por ahora.\n\nSi surge algo más con esto, solo responda aquí y lo retomo enseguida. Me alegra haberle ayudado, que tenga un excelente día.",
  call:"Esto se resuelve más rápido en vivo. Le puedo llamar o hacer una sesión segura de pantalla compartida a través de JustAnswer y guiarle paso a paso.\n\n¿Le funciona?",
  optout:"Esta pregunta está fuera de mi área, así que la voy a abrir para que otro experto le ayude mejor. Le conectarán en breve."
 }
};
const TPL_NAMES={open:"Opening + questions",ci1:"Check-in 1",ci2:"Check-in 2",close:"Closer",call:"Offer a call",optout:"Opt out"};
const SET_DEFAULT={interval:10,replyTarget:3,cap:15,beep:true,scrub:true,tier:"quick"};
const RULES_DEFAULT={lastReviewed:"2026-10-22",agreementDate:"2026-08-03"};
const OV_DEFAULT={mrr:0,retainers:0,dfhq:0};

/* ---------- state ---------- */
const S={
  tab:"desk",
  chats:[],                       // local only: active chats, purged on close
  closed:{date:todayKey(),n:0},   // local only
  tpl:JSON.parse(JSON.stringify(TPL_DEFAULT)),
  set:Object.assign({},SET_DEFAULT),
  earn:{snap:SNAP,hours:{}},
  rules:Object.assign({},RULES_DEFAULT),
  ov:Object.assign({},OV_DEFAULT),
  lang:"auto",
  linked:null, images:[], draftCtl:null,
  sample:null, sampleImg:false, db:null, col:null, dbState:"local"
};
const SYNCED=["tpl","set","earn","rules","ov"];

/* ---------- storage ---------- */
const ls={get(k){try{const v=localStorage.getItem("sshq-"+k);return v?JSON.parse(v):null}catch(e){return null}},
          set(k,v){try{localStorage.setItem("sshq-"+k,JSON.stringify(v))}catch(e){}}};
function loadLocal(){
  const c=ls.get("chats");if(Array.isArray(c))S.chats=c;
  const cl=ls.get("closed");if(cl&&cl.date===todayKey())S.closed=cl;
  SYNCED.forEach(k=>{const v=ls.get(k);if(v)S[k]=merge(k,v)});
}
function merge(k,v){
  if(k==="tpl")return {en:Object.assign({},TPL_DEFAULT.en,v.en||{}),es:Object.assign({},TPL_DEFAULT.es,v.es||{})};
  if(k==="set")return Object.assign({},SET_DEFAULT,v);
  if(k==="rules")return Object.assign({},RULES_DEFAULT,v);
  if(k==="ov")return Object.assign({},OV_DEFAULT,v);
  if(k==="earn")return {snap:v.snap||SNAP,hours:v.hours||{}};
  return v;
}
const saveChats=()=>{ls.set("chats",S.chats);ls.set("closed",S.closed)};
const pending={},inflight={};
function save(k){
  ls.set(k,S[k]);
  if(!S.col)return;
  pending[k]=true;
  if(inflight[k])return;
  (async()=>{inflight[k]=true;
    while(pending[k]){pending[k]=false;
      try{await S.col.doc(k).set({json:JSON.stringify(S[k]),at:Date.now()});setSync("Synced")}
      catch(e){setSync("Saved on this device");break}}
    inflight[k]=false;})();
}
function setSync(t){$("#sync").textContent=t}

/* ---------- utils ---------- */
let toastT;
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),1800)}
async function copy(text){
  try{await navigator.clipboard.writeText(text);return true}catch(e){}
  try{const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();return ok}catch(e){return false}
}
function plain(s){
  s=String(s||"").replace(/\r/g,"");
  s=s.replace(/```[a-zA-Z]*\n?/g,"");
  s=s.replace(/^\s*#{1,6}\s*/gm,"");
  s=s.replace(/^\s*>\s?/gm,"");
  s=s.replace(/\*\*(.+?)\*\*/g,"$1").replace(/__(.+?)__/g,"$1");
  s=s.replace(/(^|[\s(])\*(?!\s)([^*\n]+?)\*(?=[\s).,!?:;]|$)/gm,"$1$2");
  s=s.replace(/`([^`\n]+)`/g,"$1");
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,"$1 ($2)");
  s=s.replace(/^(\s*)[\*\u2022\u25CF\u25AA\u25E6\u2023+]\s+/gm,"$1- ");
  s=s.replace(/^(\s*)(\d+)\)\s+/gm,"$1$2. ");

      <div class="panel"><h3>By week</h3>${weeks.map(([w,v])=>`<div class="kv"><span>${esc(w)}</span><b class="num">${money(v,2)}</b></div>`).join("")}</div>
    </div>
    <div class="panel">
      <h3>Update the numbers</h3>
      <p class="muted small">Export your earnings report from JustAnswer and import it here. Only the totals are kept. Customer emails, names, and question text in the file are never saved.</p>
      <div class="row"><label class="btn ghost" for="csv">Import earnings CSV</label><input id="csv" type="file" accept=".csv,text/csv" hidden><span class="muted small" id="csv-status"></span></div>
    </div>
  </section>`;
  $("#hrs").addEventListener("change",e=>{S.earn.hours[mi.key]=Number(e.target.value)||0;save("earn");renderEarn()});
  $("#csv").addEventListener("change",onCsv);
}
function parseCsv(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===","){row.push(f);f=""}else if(ch==="\n"){row.push(f);rows.push(row);row=[];f=""}else if(ch!=="\r")f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.length>1);
}
async function onCsv(e){
  const file=e.target.files[0];if(!file)return;const st=$("#csv-status");
  try{
    const buf=new Uint8Array(await file.arrayBuffer());
    const u16=(buf[0]===0xFF&&buf[1]===0xFE)||(buf.length>3&&buf[1]===0&&buf[3]===0);
    let text=new TextDecoder(u16?"utf-16le":"utf-8").decode(buf).replace(/^\uFEFF/,"");
    const rows=parseCsv(text);const hd=rows.shift().map(x=>x.trim());
    const ix=n=>hd.indexOf(n);const iD=ix("Date"),iW=ix("Week"),iT=ix("Type"),iA=ix("Amount"),iU=ix("Question URL"),iS=ix("Status");
    if(iD<0||iT<0||iA<0)throw new Error("This doesn't look like a JustAnswer earnings report.");
    const sn={label:"",rows:rows.length,total:0,byType:{},byDay:{},byWeek:{},questions:0,inProgress:0};const urls=new Set();let min="",max="";
    rows.forEach(r=>{const a=parseFloat(String(r[iA]).replace(/[$,]/g,""))||0;const t=r[iT]||"Other";
      const m=String(r[iD]).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);const d=m?m[3]+"-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0"):"unknown";
      sn.total+=a;(sn.byType[t]=sn.byType[t]||{n:0,sum:0});sn.byType[t].n++;sn.byType[t].sum+=a;
      (sn.byDay[d]=sn.byDay[d]||{n:0,sum:0});sn.byDay[d].n++;sn.byDay[d].sum+=a;
      if(iW>=0){const w=r[iW]||"";sn.byWeek[w]=(sn.byWeek[w]||0)+a}
      if(iU>=0&&r[iU])urls.add(r[iU]);if(iS>=0&&r[iS]==="In progress")sn.inProgress++;
      if(d!=="unknown"){if(!min||d<min)min=d;if(!max||d>max)max=d}});
    delete sn.byDay.unknown;sn.questions=urls.size;sn.total=Math.round(sn.total*100)/100;
    const f=s=>new Date(s+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});
    sn.label=(min?f(min)+" to "+f(max):"")+" export, imported "+new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"});
    S.earn.snap=sn;save("earn");renderEarn();toast("Earnings updated");
  }catch(err){st.textContent=err.message||"Couldn't read that file."}
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.classList.contains("tab")){go(t.dataset.tab);return}
  const a=t.dataset.act;const card=t.closest(".card");const c=card&&S.chats.find(x=>x.id===card.dataset.id);
  switch(a){
    case "tab":go(t.dataset.tab);break;
    case "lang":S.lang=t.dataset.v;S.draftQ=$("#q").value;S.draftR=$("#reply").value;renderDesk();break;
    case "draft":draft();break;
    case "stop":S.draftCtl&&S.draftCtl.abort();break;
    case "clean":{const r=$("#reply");r.value=plain(r.value);S.draftR=r.value;toast("Cleaned up");break}
    case "copy-reply":{const ok=await copy($("#reply").value);toast(ok?"Copied":"Copy didn't go through");break}
    case "track":track();break;
    case "mark-sent":markSent();break;
    case "unlink":S.linked=null;S.draftQ=$("#q").value;S.draftR=$("#reply").value;renderDesk();break;
    case "rm-img":{const i=+t.dataset.i;URL.revokeObjectURL(S.images[i].url);S.images.splice(i,1);renderThumbs();break}
    case "tpl-copy":{const ok=await copy(S.tpl[S.lang==="es"?"es":"en"][t.dataset.k]);toast(ok?TPL_NAMES[t.dataset.k]+" copied":"Copy didn't go through");break}
    case "nudge":if(c)nudge(c);break;
    case "replied":if(c){c.stage="mine";c.since=Date.now();c.pinged=false;S.linked=c.id;S.draftQ="";saveChats();renderDesk();renderTabs();$("#q").focus();toast("Paste their reply on the left")}break;
    case "follow":if(c){S.linked=c.id;S.draftQ=$("#q").value;S.draftR=$("#reply").value;renderDesk();$("#q").focus()}break;
    case "sent":if(c){c.stage="sent";c.since=Date.now();c.pinged=false;saveChats();renderBoard();refreshMeters()}break;
    case "resolve":if(c){S.chats=S.chats.filter(x=>x!==c);if(S.linked===c.id)S.linked=null;bumpClosed();saveChats();refreshMeters();toast("Marked resolved")}break;
    case "remove":if(c&&confirm("Remove this chat from the board? It won't count as closed.")){S.chats=S.chats.filter(x=>x!==c);if(S.linked===c.id)S.linked=null;saveChats();refreshMeters()}break;
    case "lang-chat":if(c){c.lang=c.lang==="en"?"es":"en";saveChats();renderBoard()}break;
    case "rename":if(c){const inp=document.createElement("input");inp.type="text";inp.className="label-input";inp.value=c.label;t.replaceWith(inp);inp.focus();inp.select();
      const done=()=>{c.label=inp.value.trim()||c.label;saveChats();renderBoard()};inp.addEventListener("blur",done);inp.addEventListener("keydown",k=>{if(k.key==="Enter")inp.blur()})}break;
    case "tpl-edit":openTpl();break;
    case "tpl-save":Object.keys(TPL_NAMES).forEach(k=>{S.tpl.en[k]=$("#t-en-"+k).value.trim();S.tpl.es[k]=$("#t-es-"+k).value.trim()});save("tpl");closeDlg();toast("Templates saved");break;
    case "tpl-reset":if(confirm("Restore the default templates? Your edits will be replaced.")){S.tpl=JSON.parse(JSON.stringify(TPL_DEFAULT));save("tpl");openTpl()}break;
    case "settings":openSettings();break;
    case "set-save":{const n=(id,lo,hi,dv)=>{const v=Math.round(Number($(id).value));return v>=lo&&v<=hi?v:dv};
      S.set={interval:n("#s-iv",1,120,10),replyTarget:n("#s-rt",1,60,3),cap:n("#s-cap",1,40,15),tier:$("#s-tier").value,beep:$("#s-beep").checked,scrub:$("#s-scrub").checked,web:$("#s-web").checked};
      try{localStorage.setItem("sshq-gkey",$("#s-gkey").value.trim())}catch(e){}useGemini();
      save("set");closeDlg();if(S.tab==="desk")refreshMeters();toast("Settings saved");break}
    case "dlg-close":closeDlg();break;
    case "reviewed":S.rules.lastReviewed=todayKey();save("rules");renderRules();toast("Review logged");break;
  }
});

/* ---------- free drafting via Gemini (used when Claude access isn't available, e.g. on sebbyservices.com/hq) ---------- */
function gemKey(){try{return localStorage.getItem("sshq-gkey")||""}catch(e){return ""}}
const b64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(b)});
async function geminiSample(prompt,opts){
  const parts=[];
  for(const b of (opts.images||[]))parts.push({inline_data:{mime_type:b.type||"image/png",data:await b64(b)}});
  parts.push({text:prompt});
  const body={contents:[{role:"user",parts}],generationConfig:{temperature:0.6}};
  if(S.set.web!==false)body.tools=[{google_search:{}}];
  const model=S.set.tier==="careful"?"gemini-2.5-pro":"gemini-2.5-flash";
  let res;
  try{res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent",{method:"POST",signal:opts.signal,headers:{"Content-Type":"application/json","x-goog-api-key":gemKey()},body:JSON.stringify(body)})}
  catch(e){if(e.name==="AbortError")throw {code:"cancelled"};throw e}
  const data=await res.json().catch(()=>({}));
  if(!res.ok){if(res.status===429)throw {code:"rate_limited"};throw new Error((data.error&&data.error.message)||("HTTP "+res.status))}
  const c=data.candidates&&data.candidates[0];
  const text=((c&&c.content&&c.content.parts)||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join("").trim();
  if(!text)throw new Error("Empty reply ("+((c&&c.finishReason)||"no candidates")+")");
  return {text,truncated:c.finishReason==="MAX_TOKENS"};
}
function useGemini(){
  if(S.sample&&!S.sample.gemini)return; // Claude access wins when present
  if(gemKey()){S.sample=geminiSample;S.sample.gemini=true;S.sampleImg=true}else{S.sample=null;S.sampleImg=false}
  if(S.tab==="desk"&&$("#q")){S.draftQ=$("#q").value;S.draftR=$("#reply").value;renderDesk()}
}
useGemini();

const C=window.claude;
if(C&&typeof C.use==="function"){
  C.use("sample").then(async s=>{
    if(!s)return;S.sample=s;S.sampleImg=false;
    try{const lim=await s.limits();S.sampleImg=!!(lim&&lim.images)}catch(e){}
    if(S.tab==="desk"){S.draftQ=$("#q")?$("#q").value:S.draftQ;S.draftR=$("#reply")?$("#reply").value:S.draftR;renderDesk()}
  });
  Promise.all([C.use("db"),C.use("user")]).then(async([db,user])=>{
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    S.db=db;S.col=db.collection("data/users/"+id);setSync("Synced");
    SYNCED.forEach(k=>S.col.doc(k).onSnapshot(snap=>{
      if(!snap.exists)return;
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      try{const v=JSON.parse(snap.data().json);S[k]=merge(k,v);ls.set(k,S[k]);
        if(!(S.tab==="desk"&&(k==="earn"||k==="rules"||k==="ov"))&&!$("#dlg").open){if(S.tab==="desk"){S.draftQ=$("#q").value;S.draftR=$("#reply").value}render()}}catch(e){}
    },()=>setSync("Saved on this device")));
  });
}
})();

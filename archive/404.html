<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" href="/assets/images/logo-transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <title>Page Not Found — Sebby IT Consulting</title>

    <div class="hero-content" style="text-align: center;">
      <div style="font-size: 5rem; font-weight: 900; color: var(--indigo); font-family: var(--font); margin-bottom: 1rem;">404</div>
      <h1 class="hero-h1">Page Not Found</h1>

      <a href="/" class="btn btn-primary btn-lg">← Back to Home</a>

      <h2 style="margin-bottom: 2rem;">What can we help you with?</h2>
      <div class="grid grid-3" style="gap: 2rem; max-width: 800px; margin: 0 auto;">
        <a href="/services/" class="card" style="text-decoration: none;">

          <p style="font-size: 0.9rem;">Explore our offerings</p>

          <p style="font-size: 0.9rem;">See our work</p>
        </a>
        <a href="/contact/" class="card" style="text-decoration: none;">
          <div style="font-size: 32px; margin-bottom: 1rem;">📧</div>
          <h4>Contact</h4>
          <p style="font-size: 0.9rem;">Get in touch</p>

      </div>
    </div>

  <script src="/assets/js/main.js"></script>

# Publishes the static site to GitHub Pages on every push to main.
# Only the site files below are copied into the artifact, so repo notes
# (CLAUDE.md) and dev tooling (scripts/) are never served publicly.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          cp -R index.html 404.html CNAME robots.txt assets components services websites contact Tools _site/
          find _site -name .DS_Store -delete

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - id: deployment
        uses: actions/deploy-pages@v4
